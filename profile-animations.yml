name: Atualizar animações do perfil

on:
  schedule:
    # Uma vez por dia; o GitHub Actions usa UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gerar o Pac-Man da grade de contribuições
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman
          player_style: opportunistic
          hide_month_labels: "false"

      - name: Gerar o gatinho que evolui com commits
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const login = context.repo.owner;
            const data = await github.graphql(
              `query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    totalCommitContributions
                  }
                }
              }`,
              { login }
            );

            const commits = data.user.contributionsCollection.totalCommitContributions;
            const levels = [
              { min: 250, name: 'Mestre felino', color: '#f0b429', detail: 'Lenda dos commits' },
              { min: 100, name: 'Gato engenheiro', color: '#58a6ff', detail: 'Arquitetando ideias' },
              { min: 25, name: 'Gato curioso', color: '#a371f7', detail: 'Explorando o código' },
              { min: 0, name: 'Gatinho iniciante', color: '#8b949e', detail: 'Dando os primeiros passos' },
            ];
            const level = levels.find((item) => commits >= item.min);
            const next = levels[levels.indexOf(level) - 1];
            const progress = next
              ? Math.min(100, Math.round(((commits - level.min) / (next.min - level.min)) * 100))
              : 100;
            const nextLabel = next ? `${next.min - commits} commits para ${next.name}` : 'Nível máximo alcançado';

            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-label="${level.name}: ${commits} commits nos últimos 12 meses">
              <style>
                .bg { fill: #0d1117; stroke: #30363d; }
                .title { fill: #f0f6fc; font: 600 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
                .body { fill: #8b949e; font: 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
                .small { fill: #8b949e; font: 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
              </style>
              <rect class="bg" x="1" y="1" width="718" height="178" rx="16"/>
              <g transform="translate(48 29)">
                <path fill="${level.color}" d="M18 42 5 10l29 12L58 10l-3 32c12 9 18 23 18 38 0 30-21 50-42 50S-11 110-11 80c0-15 8-29 29-38Z"/>
                <path fill="#0d1117" d="M13 75c4 0 7 3 7 7s-3 7-7 7-7-3-7-7 3-7 7-7Zm37 0c4 0 7 3 7 7s-3 7-7 7-3-7-7-7 3-7 7-7Z"/>
                <path fill="none" stroke="#0d1117" stroke-width="4" stroke-linecap="round" d="M25 102c4 5 9 5 13 0M0 98l-20-6m22 14-22 6m70-14 22-6m-22 14 22 6"/>
                <path fill="none" stroke="${level.color}" stroke-width="10" stroke-linecap="round" d="M72 103c32 0 31 35 8 32"/>
              </g>
              <text class="title" x="180" y="58">${level.name}</text>
              <text class="body" x="180" y="86">${commits} commits nos últimos 12 meses</text>
              <text class="small" x="180" y="111">${level.detail}</text>
              <rect x="180" y="132" width="480" height="10" rx="5" fill="#21262d"/>
              <rect x="180" y="132" width="${4.8 * progress}" height="10" rx="5" fill="${level.color}"/>
              <text class="small" x="180" y="163">${nextLabel}</text>
            </svg>`;

            fs.mkdirSync('dist', { recursive: true });
            fs.writeFileSync('dist/commit-cat.svg', svg);

      - name: Publicar SVGs na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
