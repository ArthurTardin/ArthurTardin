<svg width="720" height="180" viewBox="0 0 720 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .term-bg { fill: #0d1117; }
    .term-border { fill: none; stroke: #30363d; stroke-width: 1; }
    .top-bar { fill: #161b22; }
    .dot-r { fill: #ff5f56; }
    .dot-y { fill: #ffbd2e; }
    .dot-g { fill: #27c93f; }
    .title { fill: #8b949e; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; }
    .prompt { fill: #58a6ff; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 15px; }
    .cmd { fill: #f0f6fc; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 15px; }
    .out { fill: #8b949e; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 15px; }
    .accent { fill: #7ee787; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 15px; }
    .line { opacity: 0; }
  </style>

  <rect class="term-bg" x="0.5" y="0.5" width="719" height="179" rx="10" />
  <rect class="term-border" x="0.5" y="0.5" width="719" height="179" rx="10" />

  <rect class="top-bar" x="0.5" y="0.5" width="719" height="32" rx="10" />
  <rect class="top-bar" x="0.5" y="22.5" width="719" height="10" />
  <circle class="dot-r" cx="24" cy="16" r="6" />
  <circle class="dot-y" cx="44" cy="16" r="6" />
  <circle class="dot-g" cx="64" cy="16" r="6" />
  <text class="title" x="360" y="20" text-anchor="middle">arthur@devops:~/activity</text>

  <g class="line">
    <text class="prompt" x="20" y="65">$</text>
    <text class="cmd" x="36" y="65">git log --stat --author=arthur</text>
    <animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.3s" fill="freeze" />
  </g>
  <g class="line">
    <text class="out" x="20" y="88">fetching commits, languages and contribution graph...</text>
    <animate attributeName="opacity" values="0;1" begin="0.7s" dur="0.3s" fill="freeze" />
  </g>

  <g class="line">
    <text class="prompt" x="20" y="118">$</text>
    <text class="cmd" x="36" y="118">./run-arcade-mode.sh --game pacman</text>
    <animate attributeName="opacity" values="0;1" begin="1.3s" dur="0.3s" fill="freeze" />
  </g>
  <g class="line">
    <text class="accent" x="20" y="141">stats and Pac-Man contribution graph below ↓</text>
    <animate attributeName="opacity" values="0;1" begin="1.8s" dur="0.3s" fill="freeze" />
  </g>

  <rect x="20" y="150" width="9" height="16" fill="#7ee787">
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="2.1s" repeatCount="indefinite" />
  </rect>
</svg>
